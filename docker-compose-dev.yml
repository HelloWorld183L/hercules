version: '3.8'

services:
  api:
    build: .
    command: python main_api.py
    image: hercules_api:latest
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      VALKEY_HOST: valkey
      VALKEY_PORT: 6379
    depends_on:
      valkey:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  bot:
    build: .
    command: python main.py
    image: hercules_bot:latest
    depends_on:
      api:
        condition: service_healthy
    env_file: .env
    environment:
      # Point the bot to the API service by Docker service name
      HERCULES_API_URL: http://api:8000
      VALKEY_HOST: valkey
      VALKEY_PORT: 6379
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    env_file: .env
    volumes:
      - qdrant_storage:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/collections || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    # We use valkey-bundle as it comes bundled with valkey-json which we need for our session management
    image: valkey/valkey-bundle:latest
    env_file: .env
    container_name: valkey
    volumes:
      - valkey_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - 6380:6379

  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama-model-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ollama_data:/root/.ollama
    # Pull the model from Hugging Face and store it in the `ollama_data` volume
    command: ["pull", "hf.co/DavidAU/Qwen3-8B-Hivemind-Instruct-Heretic-Abliterated-Uncensored-NEO-Imatrix-GGUF"]
    restart: "no"

volumes:
  valkey_data:
  qdrant_storage:
  ollama_data:
