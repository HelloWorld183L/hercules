[project]
name = "hercules"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "strands-agents[openai]>=1.35.0",
    "strands-agents-tools[mem0_memory]>=0.4.1",
    "discord-py>=2.0.0",
    "dateparser>=1.4.0",
    "seaborn>=0.13.2",
    "openpyxl>=3.1.5",
    "fastapi>=0.95.0",
    "uvicorn[standard]>=0.22.0",
    "python-multipart>=0.0.6",
    "httpx>=0.24.0",
    "strands-valkey-session-manager>=0.1.0",
    "scipy>=1.18.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff.lint]
ignore = ['DTZ001', 'DTZ005']

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
