version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: hercules_api:latest
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      VALKEY_HOST: valkey
      VALKEY_PORT: 6379
    depends_on:
      valkey:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    image: hercules_bot:latest
    depends_on:
      api:
        condition: service_healthy
    env_file: .env
    environment:
      # Point the bot to the API service by Docker service name
      HERCULES_API_URL: http://api:8000
      VALKEY_HOST: valkey
      VALKEY_PORT: 6379
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    env_file: .env
    volumes:
      - qdrant_storage:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/collections || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    # We use valkey-bundle as it comes bundled with valkey-json which we need for our session management
    image: valkey/valkey-bundle:latest
    env_file: .env
    container_name: valkey
    volumes:
      - valkey_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  valkey_data:
  qdrant_storage:
